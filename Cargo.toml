[package]
name = "vaporforge"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vaporforge"
path = "src/main.rs"

[dependencies]
steam_shortcuts_util = "1"
steamgriddb_api = "0.3"
steamlocate = "2"
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
eyre = "0.6"
color-eyre = "0.6"
crc32fast = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opener = "0.7"
image = { version = "0.25", features = ["jpeg"] }

[build-dependencies]
winresource = "0.1"
image = "0.25"
ico = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
